schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.txt",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/low-2026-06-30-comparable-sales-recovery-and-pro-penetration-vs-home-depot"
description = "Develop a grounded, position-taking view on the durability of Lowe's comparable-sales recovery and its Pro-penetration progress, benchmarked directly against Home Depot."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis", "LOW"]

[metadata]
uuid = "62f17a1d-b169-50b3-8567-bd0323776358"
difficulty_explanation = "The analyst must judge whether a thin, ticket-led return to positive comps is a genuine recovery, separate organic Pro momentum from acquisition-driven growth (FBM and ADG), and benchmark scale, margins and Pro strategy against Home Depot using peer statements. The challenge is isolating acquisition-related earnings drag and taking a clear stance on whether Lowe's is closing the competitive gap rather than surveying both companies."
category = "finance"

[verifier]
timeout_sec = 300.0
env = { GOOGLE_API_KEY = "${GEMINI_API_KEY}" }

[agent]
timeout_sec = 1200.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
